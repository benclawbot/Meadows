<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#273930">
  <meta name="description" content="Drift through a tidal meadow and bring an original chamber score to life.">
  <title>Salt Meadow</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <main>
    <canvas id="meadow" aria-label="The tidal meadow" tabindex="-1"></canvas>
    <section id="title-screen" aria-labelledby="title">
      <div class="introduction">
        <h1 id="title">Salt Meadow</h1>
        <p>A quiet flight through flowers and tidewater.</p>
        <button id="begin" class="primary" type="button" disabled>Begin drifting</button>
        <p id="start-error" role="alert" hidden></p>
      </div>
    </section>
    <div id="flight-controls" class="flight-controls" hidden>
      <button id="sound" class="quiet" type="button" aria-pressed="false">Mute</button>
      <button id="reset-tilt" class="quiet" type="button" hidden>Reset tilt</button>
      <button id="pause" class="quiet" type="button">Pause</button>
    </div>
    <div class="flight-messages">
      <p id="hint" class="hint" role="status" hidden></p>
      <p id="milestone" class="milestone" role="status" hidden></p>
    </div>
    <dialog id="paused" aria-labelledby="pause-title">
      <h2 id="pause-title">A moment of stillness</h2>
      <p id="pause-help">Move the mouse from the centre to steer. Hold to send a gust.</p>
      <div class="pause-actions">
        <button id="resume" class="primary" type="button" autofocus>Resume</button>
        <button id="restart" class="quiet" type="button">Drift again</button>
        <button id="change-input" class="quiet" type="button" hidden>Switch to touch</button>
        <button id="recenter" class="quiet" type="button" hidden>Reset tilt</button>
      </div>
      <p id="input-help" role="status" hidden></p>
    </dialog>
    <noscript>Enable JavaScript to enter Salt Meadow.</noscript>
  </main>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
